general {
    # On lock: start hyprlock (if not already running) and turn the display off
    # immediately. The previous "(sleep 5 && dpms off) &" version raced with
    # suspend events — if the lid closed during the 5s window, the deferred
    # dpms off would fire after after_sleep_cmd's dpms on and leave the screen
    # stuck off on resume. Firing inline avoids the race.
    lock_cmd = bash -c '(pidof hyprlock || hyprlock) & hyprctl dispatch dpms off'
    unlock_cmd = hyprctl dispatch dpms on  # Re-enable display on unlock.
    before_sleep_cmd = loginctl lock-session  # Lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # Avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 1800 # 30 min.
    on-timeout = brightnessctl -s set 10 # Set monitor backlight to minimum.
    on-resume = brightnessctl -r # Monitor backlight restore.
}

listener {
    timeout = 1800 # 30min
    on-timeout = loginctl lock-session # Lock screen when timeout has passed.
}

# idle suspend disabled: lock + DPMS off is enough.
# Suspend now only fires on lid close (handled by logind).
