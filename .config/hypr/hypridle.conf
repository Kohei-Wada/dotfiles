general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on  # Avoid having to press a key twice to turn on the display after resume.
}

listener {
    timeout = 1800 # 30 min.
    on-timeout = brightnessctl -s set 10 # Set monitor backlight to minimum.
    on-resume = brightnessctl -r # Monitor backlight restore.
}

listener {
    timeout = 1800 # 30min
    on-timeout = loginctl lock-session # Lock screen when timeout has passed.
}

# After lock: turn the display off 5s later, guarded by hyprlock running.
# Direct dpms off in lock_cmd is known to race with hyprlock (#364, omarchy#1147),
# so we use a short idle listener with a pidof-hyprlock guard instead.
listener {
    timeout = 5
    on-timeout = bash -c 'pidof hyprlock && hyprctl dispatch dpms off'
    on-resume = hyprctl dispatch dpms on
    ignore_inhibit = true
}

# idle suspend disabled: lock + DPMS off is enough.
# Suspend now only fires on lid close (handled by logind).
