# vi-style seeking (overrides the defaults: l = A-B loop, j/J = subtitle cycling)
h seek -1 relative-percent+exact
l seek 1 relative-percent+exact
j seek -10 relative-percent+exact
k seek 10 relative-percent+exact
H frame-back-step
L frame-step
g seek 0 absolute
G seek 100 absolute-percent
# A-B loop moves from l to a
a ab-loop
