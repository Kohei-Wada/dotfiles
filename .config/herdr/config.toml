onboarding = false
# herdr configuration
# Place this file at ~/.config/herdr/config.toml

[theme]
name = "catppuccin"

[terminal]
default_shell = "bash"
shell_mode = "non_login"   # bash -i 相当

[session]
resume_agents_on_restore = true

[ui]
mouse_capture = false

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"
delay_seconds = 0

[keys]
split_vertical = "prefix+v"        # 左右
split_horizontal = "prefix+minus"  # 上下（tmux の - と一致）
navigate_workspace_up = "k"
navigate_workspace_down = "j"
