# Catppuccin Mocha + MesloLGS Nerd Font Mono
font=MesloLGS Nerd Font Mono:size=14
dpi-aware=auto
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty
layer=overlay
exit-on-keyboard-focus-loss=yes

lines=16
width=56
horizontal-pad=32
vertical-pad=20
inner-pad=14
line-height=28
letter-spacing=0

[colors]
background=1e1e2eee
text=cdd6f4ff
prompt=cba6f7ff
placeholder=6c7086ff
input=cdd6f4ff
match=f5c2e7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=f5c2e7ff
counter=6c7086ff
border=cba6f7ff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=no

[key-bindings]
cancel=Escape Control+g Control+bracketleft
execute=Return KP_Enter
execute-or-next=Tab
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e
delete-prev=BackSpace Control+h
delete-prev-word=Control+BackSpace Control+w
delete-next=Delete Control+d
delete-line-backward=Control+u
prev=Up Control+p
next=Down Control+n
