---
# pin node so pre-commit uses nodeenv's bundled npm 10 (npm 12 dropped
# the --ignore-prepublish flag that pre-commit 4.6.0 still passes)
default_language_version:
  node: "22.23.1"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: '\.zsh$|\.zshrc$|\.zprofile$'

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/JohnnyMorganz/stylua
    rev: v2.5.2
    hooks:
      - id: stylua
        name: stylua (nvim)
        args: ["--config-path=.config/nvim/.stylua.toml"]
        files: .config/nvim/
      - id: stylua
        name: stylua (hypr)
        args: ["--config-path=.config/hypr/.stylua.toml"]
        files: .config/hypr/

  - repo: https://github.com/lunarmodules/luacheck
    # v1.2.0 breaks on Lua 5.5; fix is on master, unreleased (eea104d)
    rev: 2f764bdcabe8b7c19deadf0e9bb2adc19df1a4c5
    hooks:
      - id: luacheck
        name: luacheck (nvim)
        args: ["--config=.config/nvim/.luacheckrc", .config/nvim/]
        files: .config/nvim/
      - id: luacheck
        name: luacheck (hypr)
        args: ["--config=.config/hypr/.luacheckrc", .config/hypr/]
        files: .config/hypr/

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
...
